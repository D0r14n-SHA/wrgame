<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#FFF7F2">
<title>谁是伪人</title>
<style>
:root{
  /* 取自海报的印刷专色：米黄纸 / 品红 / 靛蓝 / 芥黄 / 墨绿 */
  --cream:#FF6F9C; --pink:#FF8FB1; --blue:#8FC7F0; --yellow:#FFD98A;
  --green:#9FD4B8; --red:#FF7A7A;
  --bg:#FFF7F2; --panel:#FFFFFF; --panel2:#FFF1E8; --line:#F0DCD0;
  --text:#4A3B35; --dim:#A08D82;
  --ink:#FFF7F2;
  --pink-ink:#B02A58;      /* 粉色底上的文字专用，对比度 5.98 */
  --ink-on-pink:#3A2C26;   /* 粉底按钮上的深字 */
  --dim-ink:#7D685C;
  --ok-ink:#0E7350;
  --bad-ink:#B22A36;
  --line-2:#D8C2B2;
  --safe-b:env(safe-area-inset-bottom,0px);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;height:100dvh}
body{
  background-color:#FFF7F2;
  background-image:
    linear-gradient(rgba(255,143,177,.10) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,143,177,.10) 1px,transparent 1px);
  background-size:30px 30px;
  color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  overscroll-behavior:none;
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:900;
  background:none;
  opacity:.45;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit}
.hide{display:none!important}
#netbar{position:fixed;left:0;right:0;top:0;z-index:150;padding:8px 14px;font:12px/1.4 var(--mono);
  letter-spacing:.5px;text-align:center;background:var(--pink);color:var(--ink-on-pink);font-weight:700;
  transform:translateY(-100%);transition:transform .25s}
#netbar.show{transform:translateY(0)}
#home{justify-content:flex-start}
#home>*:first-child{margin-top:auto}
#home>*:last-child{margin-bottom:auto}
#home{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px 22px calc(28px + var(--safe-b))}
.logo img{width:132px;height:132px;object-fit:cover;border-radius:6px;
  box-shadow:0 6px 0 rgba(255,111,156,.22)}
.logo{font-size:46px;line-height:1;margin-bottom:10px;transform:rotate(-6deg)}
h1{font-size:36px;margin:4px 0 8px;letter-spacing:-1.5px;font-weight:900;line-height:1;
  color:var(--pink-ink);transform:skewX(-7deg);
  text-shadow:0 3px 0 rgba(255,111,156,.22),0 6px 18px rgba(255,111,156,.15)}
.sub{color:var(--dim);font-size:12px;letter-spacing:2px;margin-bottom:10px;text-transform:uppercase;font-family:var(--mono)}
.badge{font:11px/1 var(--mono);letter-spacing:1px;color:var(--pink-ink);background:transparent;
  border:1px solid var(--cream);padding:6px 12px;border-radius:2px;margin-bottom:22px}
.panel{width:100%;max-width:400px;background:var(--panel);border:2px solid var(--cream);
  border-radius:2px;padding:20px 18px;box-shadow:6px 6px 0 rgba(232,84,124,.28)}
.field{margin-bottom:12px}
.field label{display:block;font:10px/1.2 var(--mono);letter-spacing:2px;
  color:#9A8577;margin-bottom:9px}
.field input{width:100%;height:50px;border-radius:2px;background:#FFFFFF;border:2px solid #E0C3B4;
  padding:0 15px;color:var(--text);outline:none;transition:.16s;font-family:var(--mono);font-size:15px}
.field input:focus{border-color:var(--pink-ink);box-shadow:3px 3px 0 rgba(232,84,124,.3)}
.field input::placeholder{color:#C9B3A4;font-family:-apple-system,"PingFang SC",sans-serif}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:52px;border-radius:2px;
  min-width:0;padding:0 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:16px;font-weight:800;letter-spacing:1px;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translate(3px,3px)}
.btn.primary{background:var(--cream);color:var(--ink-on-pink);border:2px solid var(--cream);box-shadow:4px 4px 0 var(--pink)}
.btn.primary:active{box-shadow:1px 1px 0 var(--pink)}
.btn.ghost{background:#FFFFFF;border:2px solid var(--line);color:var(--text);box-shadow:4px 4px 0 var(--pink)}
.btn.ghost:active{box-shadow:1px 1px 0 var(--pink)}
.btn>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn[disabled]{opacity:1;pointer-events:none;box-shadow:none;background:#F5E9E0;border-color:#EFDDD1;color:#6F5E54}
.divider{display:flex;align-items:center;gap:12px;color:#C9B3A4;font:10px/1 var(--mono);
  letter-spacing:2px;margin:18px 0;text-transform:uppercase}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.err{color:var(--pink);font:12px/1.4 var(--mono);text-align:center;min-height:18px;margin-top:10px}
.tiny{font-size:11px;color:#8A7266;text-align:center;margin-top:16px;line-height:1.8;letter-spacing:.3px}
#room{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;padding:12px 14px 10px;flex:0 0 auto;
  border-bottom:2px solid var(--line);background:rgba(255,255,255,.92);backdrop-filter:blur(8px)}
.roomcode{display:flex;align-items:center;gap:7px;background:#FFFFFF;border:1px solid var(--line);
  border-radius:2px;padding:0 12px;height:40px;flex:0 0 auto;white-space:nowrap}
.roomcode b{letter-spacing:3px;font:700 16px/1 var(--mono);color:var(--pink-ink);flex:0 0 auto}
.phasepill{margin-left:auto;display:flex;align-items:center;height:34px;font:11px/1 var(--mono);padding:0 10px;border-radius:2px;
  background:transparent;color:var(--pink-ink);border:1px solid var(--cream);white-space:nowrap;
  flex:0 0 auto;overflow:hidden;text-overflow:ellipsis;max-width:150px;letter-spacing:.5px}
.phasepill.hot{background:var(--pink);color:var(--ink-on-pink);border-color:var(--pink);font-weight:700}
.players{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:13px 12px 12px;
  scrollbar-width:none;flex:0 0 auto;border-bottom:1px solid var(--line)}
.players::-webkit-scrollbar{display:none}
.players::before,.players::after{content:"";flex:0 0 1px;margin:auto}
.pl{flex:0 0 auto;width:54px;position:relative;text-align:center;transition:.15s;user-select:none;-webkit-user-select:none;padding-bottom:2px}
.pl .av{width:44px;height:44px;margin:0 auto 6px;border-radius:3px;display:flex;align-items:center;
  justify-content:center;position:relative;overflow:visible;background:#FFF7F2;
  border:2px solid var(--c,#EAD5C6);box-shadow:3px 3px 0 rgba(255,111,156,.28);transition:.16s}
.pl.host .av{border-width:3px;border-color:var(--pink-ink);box-shadow:0 0 0 2px #FFE3EC,3px 3px 0 rgba(255,111,156,.35)}
.pl .av img{width:100%;height:100%;object-fit:cover;display:block;border-radius:2px;filter:contrast(1.05) saturate(1.05)}
.pl .av::after{content:"";position:absolute;inset:0;border-radius:2px;pointer-events:none;z-index:0;
  background:linear-gradient(180deg,transparent 62%,rgba(255,247,242,.75))}
.pl .nm{font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.pl .rl{font:9px/1.3 var(--mono);margin-top:2px;letter-spacing:.5px}
.pl .rl.uc{color:var(--pink)}
.pl .rl.civ{color:var(--pink-ink)}
.pl.dead{opacity:.3}
.pl.dead .av{filter:grayscale(1)}
.pl.dead .nm{text-decoration:line-through}
.pl.me .av{border-color:var(--pink-ink);box-shadow:3px 3px 0 rgba(232,84,124,.75)}
.pl.me .nm{color:var(--pink-ink);font-weight:700}
.pl.votable{cursor:pointer}
.pl.votable .av{animation:pulse 1.5s infinite}
.pl.picked .av{border-color:#FF2D55;animation:none;box-shadow:3px 3px 0 #FF2D55,0 0 0 3px rgba(255,45,85,.25)}
@keyframes pulse{
  0%,100%{box-shadow:3px 3px 0 rgba(255,45,149,.75)}
  50%{box-shadow:3px 3px 0 rgba(255,45,149,.2),0 0 0 4px rgba(255,45,149,.12)}
}
.pl .badge2{z-index:2;position:absolute;right:-7px;top:-7px;min-width:18px;height:18px;border-radius:2px;
  background:var(--pink);color:#4A3B35;font:700 11px/18px var(--mono);padding:0 4px}
.pl .rdy{position:absolute;z-index:2;left:-4px;bottom:-4px;width:10px;height:10px;border-radius:1px;
  background:var(--cream);border:2px solid #4A3B35}
.pl .offdot{position:absolute;z-index:2;right:-4px;bottom:-4px;width:10px;height:10px;border-radius:1px;
  background:#D8C2B2;border:2px solid #4A3B35}
.hostmark::before{content:""}
.hostmark{width:11px;height:11px;border-radius:50%;background:var(--pink-ink);
  position:absolute;left:-2px;top:-2px;z-index:3;
  box-shadow:0 0 0 2px #FFF,0 1px 2px rgba(74,59,53,.3)}
.hosttag{display:block;margin:3px auto 0;padding:1px 5px;border-radius:2px;width:fit-content;
  background:var(--pink-ink);color:#FFF;font:700 9px/1.3 var(--mono);letter-spacing:.5px}
.pl.offline .av{opacity:.4}
.pl .av.ucglow{border-color:var(--pink);box-shadow:3px 3px 0 rgba(255,45,149,.75)}
.pl .av.civglow{border-color:var(--pink-ink);box-shadow:3px 3px 0 rgba(255,111,156,.38)}
#feed{flex:1 1 auto;min-height:0;overflow-y:auto;padding:12px 12px 6px;display:flex;
  flex-direction:column;gap:9px;-webkit-overflow-scrolling:touch}
.sys{max-width:100%;align-self:center;text-align:center;
  font:11px/1.6 var(--mono);color:#A08D82;letter-spacing:.3px;
  padding:5px 0;margin:3px 0;border-top:1px solid #FFF1E8;border-bottom:1px solid #FFF1E8;
  word-break:break-word}
.msg{max-width:84%;font-size:14px;word-break:break-word}
.msg:last-child{animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:translateY(5px)}}
.msg .who{font:10px/1 var(--mono);color:var(--dim);margin-bottom:4px;padding-left:3px;letter-spacing:.5px}
.msg .bub{background:var(--panel2);border:1px solid #F0DCD0;border-left:3px solid #C9B3A4;margin-bottom:7px;
  padding:9px 12px;border-radius:1px;line-height:1.5}
.msg.mine{align-self:flex-end;text-align:right}
.msg.mine .who{padding-right:3px;text-align:right}
.msg.mine .bub{background:#FFF1E8;border:1px solid #EAD5C6;border-right:3px solid var(--cream);
  border-left:1px solid #EAD5C6;text-align:left}
.msg.ghost .bub{background:#FFF1E8;border:1px dashed var(--blue);border-left:3px solid var(--blue);
  color:#A99BD6;font-style:italic}
.msg.ghost .who{color:var(--blue)}
.msg.ghost .who::after{content:" · 幽灵";font-size:9px;opacity:.8;letter-spacing:1px}
.wordbar{padding:0 14px 10px;flex:0 0 auto}
.holdword{display:flex;align-items:center;justify-content:center;height:54px;border-radius:2px;width:100%;
  background:#FFFFFF;border:2px dashed var(--cream);color:var(--pink-ink);
  font-size:14px;font-weight:800;letter-spacing:.5px;padding:0 16px;
  user-select:none;-webkit-user-select:none;touch-action:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  box-shadow:inset 0 0 26px rgba(233,220,195,.06)}
.holdword:active{background:rgba(233,220,195,.12)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 12px 9px;scrollbar-width:none;flex:0 0 auto}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;min-height:40px;font:12px/1 var(--mono);padding:0 14px;
  border-radius:2px;background:#FFFFFF;border:1px solid #E8D5C8;color:#7A675C;letter-spacing:.3px}
.chip:active{background:var(--cream);color:#4A3B35;border-color:var(--pink-ink)}
footer{padding:10px 12px calc(12px + var(--safe-b));border-top:1px solid var(--line);
  background:#FFF7F2;backdrop-filter:blur(10px);flex:0 0 auto}
.actrow{display:flex;gap:8px;margin-bottom:10px;align-items:stretch}
.actrow .btn{flex:1 1 0;width:auto;min-width:0;padding:0 12px;white-space:nowrap;height:48px;font-size:15px}
.actrow>div{white-space:nowrap;flex:0 0 auto;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;justify-content:center;font:12px/1 var(--mono);color:var(--dim);letter-spacing:.5px}
.chatrow{display:flex;gap:8px;align-items:center}
.chatrow input{flex:1;height:46px;border-radius:2px;background:#FFFFFF;border:2px solid #E0C3B4;
  padding:0 14px;color:var(--text);outline:none;font-size:14px;min-width:0}
.chatrow input:focus{border-color:var(--pink-ink);box-shadow:3px 3px 0 rgba(232,84,124,.25)}
.chatrow input::placeholder{color:#C9B3A4;font-size:13px}
.chatrow input:disabled{opacity:.5;border-color:#F5E4D8;background:#FFF7F2}
.send{width:46px;height:46px;border-radius:2px;background:var(--cream);color:#4A3B35;
  display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto;
  box-shadow:3px 3px 0 var(--pink);font-weight:900}
.send:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--pink)}
#veil{position:fixed;inset:0;background:#FFF7F2;z-index:99;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;padding:24px}
#veil .tip{font:10px/1 var(--mono);color:var(--dim);letter-spacing:3px;text-transform:uppercase}
#veil .w{font-size:48px;font-weight:900;letter-spacing:5px;color:var(--pink-ink);
  text-shadow:0 4px 0 rgba(255,111,156,.20),0 8px 22px rgba(255,143,177,.18);word-break:break-all;text-align:center}
#veil .rol{font:11px/1 var(--mono);padding:8px 16px;border:1px solid var(--pink);
  color:var(--pink);border-radius:2px;letter-spacing:2px;text-transform:uppercase}
#veil .rol:empty{display:none}
#modal{position:fixed;inset:0;background:rgba(255,247,242,.95);z-index:98;display:flex;
  align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(4px)}
.card{width:100%;max-width:380px;max-height:min(82vh,calc(100dvh - 48px));overflow-y:auto;background:#FFFFFF;
  border:2px solid var(--cream);border-radius:2px;padding:22px;text-align:center;
  box-shadow:8px 8px 0 rgba(255,45,149,.32);animation:pop .2s}
.card h2{margin:8px 0 6px;font-size:23px;font-weight:900;letter-spacing:.5px}
.card .big{font-size:42px;margin-bottom:4px;line-height:1}
.card p{margin:6px 0;font-size:14px;color:#7D685C;line-height:1.6}
.pl .av.unknown{background:#FFFFFF;border-color:#F0DCD0;color:#C9B3A4;
  font:900 20px/1 var(--mono)}
.pl .av.unknown img{display:none}

#ejectstage{position:fixed;inset:0;z-index:97;background:rgba(255,247,242,0);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:26px;transition:background .3s ease;pointer-events:none}
#ejectstage.show{background:#FFF7F2;pointer-events:auto}
.ejectbox{width:180px;height:180px;position:relative;border:2px solid var(--cream);border-radius:3px;
  overflow:hidden;transform:scale(.3);opacity:0;
  transition:transform .45s cubic-bezier(.2,1.35,.4,1),opacity .3s ease}
#ejectstage.show .ejectbox{transform:scale(1);opacity:1}
.shard{position:absolute;inset:0;filter:drop-shadow(0 2px 3px rgba(74,59,53,.18))}
.shard img{width:100%;height:100%;object-fit:cover;display:block}
#ejectstage.shatter .ejectbox{overflow:visible;border-color:transparent;transition:border-color .2s ease}
#ejectstage.shatter .shard{animation:shatter 1s cubic-bezier(.3,0,.55,1) forwards}
@keyframes shatter{
  0%{transform:translate(0,0) rotate(0) scale(1);opacity:1;filter:brightness(1)}
  18%{transform:translate(calc(var(--tx)*.07),calc(var(--ty)*.07)) rotate(calc(var(--rot)*.12)) scale(1.015);
      opacity:1;filter:brightness(1.08)}
  100%{transform:translate(var(--tx),var(--ty)) rotate(var(--rot)) scale(.88);opacity:0;filter:brightness(.98)}
}
.ejectflash{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 45%,rgba(255,45,85,.8),transparent 68%)}
#ejectstage.flash .ejectflash{animation:ejectflash .55s ease}
@keyframes ejectflash{0%,100%{opacity:0}28%{opacity:1}}
.ejectlabel{font-size:24px;font-weight:900;letter-spacing:2px;opacity:0;transform:translateY(20px);
  transition:opacity .4s ease .15s,transform .5s cubic-bezier(.2,1.25,.4,1) .15s}
#ejectstage.label .ejectlabel{opacity:1;transform:translateY(0)}

#flipstage{position:fixed;inset:0;z-index:96;background:rgba(255,247,242,0);
  display:flex;align-items:center;justify-content:center;
  transition:background .35s ease;pointer-events:none}
#flipstage.show{background:rgba(255,247,242,.98);pointer-events:auto}

.flipwrap{perspective:1000px;transform:scale(.62) translateY(46px) rotate(-4deg);opacity:0;
  transition:transform .62s cubic-bezier(.18,1.25,.36,1),opacity .4s ease}
.flipwrap.enter{transform:scale(1) translateY(0) rotate(0deg);opacity:1}
.flipwrap.out{transform:scale(.88) translateY(-16px);opacity:0;
  transition:transform .45s ease-in,opacity .45s ease-in}

.flipcard{width:200px;height:266px;position:relative;
  transform-style:preserve-3d;-webkit-transform-style:preserve-3d;
  transition:transform .7s cubic-bezier(.34,.06,.16,1)}
.flipcard.flipped{transform:rotateY(180deg)}
.flipcard .face{position:absolute;inset:0;backface-visibility:hidden;
  -webkit-backface-visibility:hidden;border:2px solid var(--cream);border-radius:3px;
  overflow:hidden;box-shadow:10px 16px 44px rgba(255,111,156,.34)}
.flipcard .front{transform:translateZ(1px)}
.flipcard .front img{width:100%;height:100%;object-fit:cover;display:block}
.flipcard .back{transform:rotateY(180deg) translateZ(1px);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;padding:18px;
  background:linear-gradient(160deg,#FFE3D5,#FFF1E8 60%,#FFF1E8);
  box-shadow:0 0 0 2px var(--cream),0 0 48px rgba(255,111,156,.38),10px 16px 44px rgba(255,111,156,.34)}
.flipcard .fword{font-size:30px;font-weight:900;color:var(--pink-ink);line-height:1.15;
  text-shadow:0 2px 0 rgba(255,111,156,.22);text-align:center;word-break:break-all;
  opacity:0;transform:translateY(14px) scale(.9);
  transition:opacity .45s ease .55s,transform .5s cubic-bezier(.2,1.3,.4,1) .55s}
.flipcard.flipped .fword{opacity:1;transform:translateY(0) scale(1)}
.flipcard .frole{font:10px/1 var(--mono);color:var(--pink);letter-spacing:4px;
  opacity:0;transition:opacity .4s ease .95s}
.flipcard.flipped .frole{opacity:1}

#cardtable{position:fixed;inset:0;z-index:94;background:#FFF7F2;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:16px;
  padding:22px;overflow-y:auto}
#cardtable>*:first-child{margin-top:auto}
#cardtable>*:last-child{margin-bottom:auto}
.ct-head{display:flex;align-items:baseline;gap:14px}
.ct-title{font-size:26px;font-weight:900;letter-spacing:8px;color:var(--pink-ink);
  text-shadow:0 2px 0 rgba(255,111,156,.22)}
.ct-timer{font:700 20px/1 var(--mono);color:var(--pink)}
.ct-cards{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;max-width:340px}
.pcard{width:100px;height:133px;border:2px solid var(--cream);border-radius:3px;overflow:hidden;
  position:relative;background:#FFFFFF;box-shadow:4px 4px 0 rgba(255,111,156,.28);transition:transform .12s,box-shadow .12s}
.pcard img{width:100%;height:100%;object-fit:cover;display:block}
.pcard:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(255,111,156,.28)}
.pcard.taken{border-color:#D8C2B2}
.pcard.taken::after{content:"";position:absolute;inset:0;background:rgba(255,247,242,.72);z-index:1}
.pcard.taken:active{transform:none}
.pcard .who{position:absolute;left:0;right:0;bottom:0;z-index:2;height:19px;line-height:19px;
  background:rgba(0,0,0,.85);color:var(--pink-ink);font:700 10px var(--mono);padding:0 4px;
  text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard.mine{border-color:var(--pink);box-shadow:4px 4px 0 rgba(232,84,124,.65)}
.pcard.mine::after{display:none}
.ct-tip{font:11px/1 var(--mono);color:var(--dim);letter-spacing:2px;text-align:center}

#hintbar{flex:0 0 auto;margin:0 14px 10px;background:var(--pink);color:#4A3B35;
  font:700 11px/1.4 var(--mono);letter-spacing:.3px;padding:8px 12px;border-radius:2px;
  box-shadow:3px 3px 0 rgba(255,111,156,.22);text-align:center}

<script>
/* ══════════════════════════════════════════════════════════════
   mini MQTT 3.1.1 客户端（只做 QoS0，够用）
   ══════════════════════════════════════════════════════════════ */
const BROKERS = [
  'wss://broker.emqx.io:8084/mqtt',
  'wss://broker.hivemq.com:8884/mqtt',
];

function mqttLen(n){
  const out = [];
  do { let b = n % 128; n = Math.floor(n / 128); if (n > 0) b |= 0x80; out.push(b); } while (n > 0);
  return out;
}
function utf8(s){ return Array.from(new TextEncoder().encode(s)); }
function str(bytes){ return new TextDecoder().decode(bytes); }

class MiniMQTT {
  constructor(){
    this.ws = null; this.connected = false; this.clientId = '';
    this.topicHandlers = new Map();  // topic -> fn
    this.onState = () => {};
    this.pid = 1; this.keepAlive = 45; this.timer = null; this.urlIdx = 0;
    this.retry = 0; this.manualClose = false; this.lastRecv = 0;
  }

  connect(clientId){
    return new Promise((resolve, reject) => {
      this.clientId = clientId;
      this.manualClose = false;
      this.rx = null;   // 断线残包会毒化新连接
      const url = BROKERS[this.urlIdx % BROKERS.length];
      let done = false;
      try { this.ws = new WebSocket(url, ['mqtt']); } catch (e) { reject(e); return; }
      this.ws.binaryType = 'arraybuffer';
      const timeout = setTimeout(() => {
        if (!done) { done = true; try{this.ws.close()}catch{}; reject(new Error('连接超时')); }
      }, 9000);

      this.ws.onopen = () => {
        const cid = utf8(this.clientId);
        const body = [0,4,...utf8('MQTT'),4,0x02,0,this.keepAlive, 0,cid.length, ...cid];
        this.ws.send(new Uint8Array([0x10, ...mqttLen(body.length), ...body]));
      };
      this.ws.onmessage = (e) => {
        this.lastRecv = Date.now();
        const chunk = new Uint8Array(e.data);
        // 累积成缓冲，按 MQTT 剩余长度逐个切包（一个 WS 帧可能含多个/半个包）
        this.rx = this.rx && this.rx.length
          ? (() => { const t = new Uint8Array(this.rx.length + chunk.length); t.set(this.rx); t.set(chunk, this.rx.length); return t; })()
          : chunk;
        while (this.rx.length >= 2) {
          let mi = 1, mlen = 0, mb, mok = false;
          do {
            if (mi >= this.rx.length) { mok = true; break; }      // 长度字段还没收全
            mb = this.rx[mi++]; mlen += (mb & 0x7f) * (1 << (7 * (mi - 2)));
            if (mi > 5) { this.rx = null; return; }   // 畸形长度头，丢弃重来
          } while (mb & 0x80);
          if (mok) return;
          const total = mi + mlen;
          if (this.rx.length < total) return;                      // 包体还没收全
          const pkt = this.rx.slice(0, total);
          this.rx = this.rx.slice(total);
          try { this._packet(pkt); } catch (err) { console.warn('mqtt packet', err); }
        }
      };
      this.ws.onmessageOriginal = null;
      this._packet = (b) => {
        if (b.length < 2) return;
        let i = 0;
        const type = b[i] >> 4; i++;
        // 解析剩余长度
        let mul = 1, len = 0, byte;
        do { byte = b[i++]; len += (byte & 0x7f) * mul; mul *= 128; } while (byte & 0x80);
        const payload = b.slice(i, i + len);

        if (type === 2) {                       // CONNACK
          if (!done) { done = true; clearTimeout(timeout); }
          if (payload[1] === 0) {
            this.connected = true; this.retry = 0;
            this.startPing();
            // 重连后重订阅
            for (const t of this.topicHandlers.keys()) this._sub(t);
            this.onState('online');
            resolve(true);
          } else { reject(new Error('broker 拒绝 ' + payload[1])); }
        }
        else if (type === 3) {                  // PUBLISH
          const qos = (b[0] & 0x06) >> 1;
          const skip = qos > 0 ? 2 : 0;         // QoS>0 时主题后面跟着 packet id
          const tl = (payload[0] << 8) | payload[1];
          const topic = str(payload.slice(2, 2 + tl));
          const data = str(payload.slice(2 + tl + skip));
          for (const [pat, fn] of this.topicHandlers) {
            if (pat === topic || (pat.endsWith('#') && topic.startsWith(pat.slice(0,-1)))) fn(topic, data);
          }
        }
      };
      this.ws.onclose = () => {
        this.connected = false; this.stopPing();
        if (!done) { done = true; clearTimeout(timeout); reject(new Error('连接断开')); }
        this.onState('offline');
        if (!this.manualClose) this.scheduleReconnect();
      };
      this.ws.onerror = () => { /* 交给 onclose */ };
    });
  }

  scheduleReconnect(){
    this.retry++;
    if (this.retry > 6) { this.onState('retry'); this.retry = 0; }
    this.urlIdx++;                        // 换一个 broker 试试
    const wait = Math.min(1000 * this.retry, 5000);
    clearTimeout(this.retryTimer);
    this.retryTimer = setTimeout(() => {
      if (this.manualClose) return;
      this.connect(this.clientId).catch(() => {});
    }, wait);
  }

  subscribe(topic, fn){
    this.topicHandlers.set(topic, fn);
    if (this.connected) this._sub(topic);
  }
  _sub(topic){
    const t = utf8(topic);
    this.pid = (this.pid % 65535) + 1;            // packet id 不能是 0
    const body = [this.pid >> 8 & 0xff, this.pid & 0xff, t.length >> 8 & 0xff, t.length & 0xff, ...t, 0];
    if (this.connected) this.ws.send(new Uint8Array([0x82, ...mqttLen(body.length), ...body]));
  }
  publish(topic, obj){
    if (!this.connected) return false;
    const t = utf8(topic), p = utf8(typeof obj === 'string' ? obj : JSON.stringify(obj));
    const body = [t.length >> 8 & 0xff, t.length & 0xff, ...t, ...p];
    try { this.ws.send(new Uint8Array([0x30, ...mqttLen(body.length), ...body])); return true; }
    catch { return false; }
  }
  startPing(){
    this.stopPing();
    this.lastRecv = Date.now();
    this.timer = setInterval(() => {
      if (!this.connected) return;
      // 手机切换网络时 WebSocket 常常「假活着」：不报错但收不到任何数据。
      // 超过两个 keepAlive 周期没有任何回包，就主动断开让它重连。
      if (Date.now() - this.lastRecv > this.keepAlive * 2000) {
        try { this.ws.close(); } catch {}
        return;
      }
      try { this.ws.send(new Uint8Array([0xC0, 0])); } catch {}
    }, this.keepAlive * 1000 * 0.8);
  }
  stopPing(){ if (this.timer) { clearInterval(this.timer); this.timer = null; } }
  close(){ this.manualClose = true; clearTimeout(this.retryTimer); this.retryTimer = null; this.stopPing(); try { this.ws.close(); } catch {} }
}

const VOTE_SECONDS = 50;         // 投票时长上限

const MAX_MSG = 200;

const rnd = (n) => Math.floor(Math.random() * n);
const pick = (a) => a[rnd(a.length)];
function shuffle(a){ const x=[...a]; for(let i=x.length-1;i>0;i--){ const j=rnd(i+1); [x[i],x[j]]=[x[j],x[i]]; } return x; }

function pushMsg(room, msg){
  room.messages.push(msg);
  if (room.messages.length > MAX_MSG) room.messages.splice(0, room.messages.length - MAX_MSG);
}
function sysMsg(room, text){
  pushMsg(room, { id: uid(), sys: true, text, at: Date.now() });
}

    messages: [], lastTally:null, lastOut:null, winner:null, voteDeadline:null,
  };
  room.players.push({ id:hostId, clientId:hostId, name:hostName, avatar:-1, alive:true, role:null, word:null, lastSeen:Date.now(), online:true });
  sysMsg(room, `${hostName} 创建了房间`);
  return room;
}

/* 六个角色，抢卡决定你是哪一个 */
const CARD_NAMES = ['后藤一里', '山田凉', '喜多郁代', '伊地知虹夏', 'Ave Mujica', '千早爱音'];
const CARD_SECONDS = 25;

function startGame(room){
  const n = room.players.length;
  if (n < 3) return { error: '至少要 3 个人才能开局' };

  // 从六张海报里随机抽 n 张，玩家抢
  const posters = shuffle([0, 1, 2, 3, 4, 5]).slice(0, n);
  room.gameId = uid();
  room.cards = posters.map((poster, i) => ({ slot: i, poster, takenBy: null }));
  room.cardsDeadline = Date.now() + CARD_SECONDS * 1000;
  room.phase = 'cards';
  room.round = 0;
  room.votes = {};
  room.voteDeadline = null;
  room.nextAt = null;
  room.lastTally = null;
  room.lastOut = null;
  room.winner = null;
  room.hint = '';
  room.idleRounds = 0;
  room.turn = null;
  room.messages = [];
  room.players.forEach((p) => {
    p.alive = true; p.role = null; p.word = null; p.avatar = -1;
  });
  sysMsg(room, `抢卡开始，${n} 张卡先到先得`);
  return {};
}

const isLatinWord = (x) => /^[A-Za-z0-9]+$/.test(x);

/* 抢完卡（或超时）→ 发词开打 */
function beginPlay(room){
  room.cardsDeadline = null;
  // 人数可能在中途变多（抢卡期加入的被拒，但移除玩家后重开会），保证每人一张
  if (room.cards) {
    while (room.cards.length < room.players.length) {
      const used = new Set(room.cards.map((c) => c.poster));
      const free = [0,1,2,3,4,5].filter((i) => !used.has(i));
      if (!free.length) break;
      room.cards.push({ slot: room.cards.length, poster: free[0], takenBy: null });
    }
  }
  if (room.players.length < 3) {
    room.phase = 'lobby'; room.turn = null; room.cards = null;
    sysMsg(room, '人数不足 3 人，本局取消');
    return;
  }

  // 手慢的自动补剩下的卡
  const left = room.cards.filter((c) => !c.takenBy);
  const waiting = room.players.filter((p) => !room.cards.some((c) => c.takenBy === p.id));
  waiting.forEach((p, i) => {
    const c = left[i];
    if (c) { c.takenBy = p.id; p.avatar = c.poster; }
  });

  const n = room.players.length;
  const ucCount = n >= 6 ? 2 : 1;   // 3-5 人 1 个伪人，6 人 2 个
  const [a, b] = pick(WORD_PAIRS);
  const flip = rnd(2) === 0;
  const civWord = flip ? b : a;
  const ucWord = flip ? a : b;
  const ucIdx = new Set(shuffle([...Array(n).keys()]).slice(0, ucCount));

  room.players.forEach((p, i) => {
    p.alive = true;
    p.role = ucIdx.has(i) ? 'undercover' : 'civilian';
    p.word = ucIdx.has(i) ? ucWord : civWord;
  });

  room.phase = 'discuss';
  room.round = 1;
  room.idleRounds = 0;
  // 首轮翻卡动画会占掉几秒，给第一位多留一点
  room.turn = { order: room.players.filter((p) => p.alive).map((p) => p.id), idx: 0,
    deadline: Date.now() + (TURN_SECONDS + 6) * 1000 };

  // 词长/语种不一样时必须警告，否则一句话就听出来了
  const lenDiff = civWord.length !== ucWord.length;
  const langDiff = isLatinWord(civWord) !== isLatinWord(ucWord);
  room.hint = (lenDiff || langDiff)
    ? '本局两词长度或语种不同 —— 禁止交流词的长度'
    : '';

  sysMsg(room, `游戏开始 · ${n} 名玩家，${ucCount} 名伪人`);
  if (room.hint) sysMsg(room, '⚠️ ' + room.hint);
}

function settleVote(room){
  if (room.phase !== 'vote') return;
  room.voteDeadline = null;
  const tally = {};
  for (const p of room.players) if (p.alive) tally[p.id] = 0;
  for (const [voter, target] of Object.entries(room.votes)) {
    if (target === 'abstain') continue;
    const v = room.players.find(x => x.id === voter);
    if (v && v.alive && tally[target] !== undefined) tally[target]++;
  }
  room.lastTally = tally;
  const max = Math.max(...Object.values(tally), 0);
  const top = Object.keys(tally).filter(id => tally[id] === max && max > 0);

  if (top.length === 0) {
    openDiscussion(room, true);
    room.idleRounds = (room.idleRounds || 0) + 1;
    sysMsg(room, `这一轮没人被投出去`);
    if (room.idleRounds >= 3) {
      room.winner = 'undercover'; room.phase = 'over';
      sysMsg(room, '连续三轮没人出局，伪人获胜');
    }
    return;
  }
  if (top.length > 1) {
    openDiscussion(room, true);
    room.idleRounds = (room.idleRounds || 0) + 1;
    const names = top.map(id => room.players.find(p => p.id === id).name).join('、');
    sysMsg(room, `平票（${names}），本轮无人出局`);
    if (room.idleRounds >= 3) {
      room.winner = 'undercover'; room.phase = 'over';
      sysMsg(room, '连续三轮没人出局，伪人获胜');
    }
    return;
  }
  const out = room.players.find(p => p.id === top[0]);
  out.alive = false;
  room.idleRounds = 0;
  room.lastOut = { id: out.id, name: out.name, role: out.role, votes: max, avatar: out.avatar };
  room.phase = 'result';
  room.votes = {};
  room.nextAt = Date.now() + NEXT_DELAY;
  sysMsg(room, `${out.name} 出局 · ${out.role === 'undercover' ? '伪人' : '人类'}`);
  checkWin(room);
}

const TURN_SECONDS = 75;   // 单个人发言上限，防掉线卡死

/* 移除玩家：清掉所有指向他的引用，必要时判胜负 */
function removePlayer(room, p){
  room.players = room.players.filter((x) => x.id !== p.id);
  if (room.cards) for (const c of room.cards) if (c.takenBy === p.id) c.takenBy = null;
  for (const [voter, target] of Object.entries(room.votes)) {
    if (voter === p.id || target === p.id) delete room.votes[voter];
  }
  if (room.turn) {
    const i = room.turn.order.indexOf(p.id);
    if (i >= 0) {
      room.turn.order.splice(i, 1);
      if (i < room.turn.idx) room.turn.idx--;
      else if (i === room.turn.idx && room.phase === 'discuss') {
        checkWin(room);
        if (room.phase === 'over') {
          room.turn = null; room.voteDeadline = null; room.nextAt = null;
          return;
        }
        room.turn.idx = i - 1;
        advanceTurn(room);
      }
    }
  }
  if (room.phase === 'vote' && room.voteDeadline) {
    const need = room.players.filter((p) => p.alive && p.online !== false).length;
    const cast = room.players.filter((p) => p.alive && room.votes[p.id] !== undefined).length;
    if (need > 0 && cast >= need) settleVote(room);
  }
  if (room.phase === 'cards' && room.cards && room.players.every((pl) => room.cards.some((c) => c.takenBy === pl.id))) {
    beginPlay(room);
  }
  if (room.phase === 'discuss' || room.phase === 'vote' || room.phase === 'result') checkWin(room);
}

/* 进入讨论：重建发言顺序 + 起超时 */
function openDiscussion(room, nextRound){
  if (nextRound) room.round++;
  room.phase = 'discuss';
  room.votes = {};
  room.voteDeadline = null;
  room.nextAt = null;
  room.lastOut = null;
  room.turn = {
    order: room.players.filter((p) => p.alive).map((p) => p.id),
    idx: 0,
    deadline: Date.now() + TURN_SECONDS * 1000,
  };
}

/* 轮到下一个；说完了就开投票 */
function advanceTurn(room){
  const nameOf = (id) => (room.players.find((p) => p.id === id) || {}).name || '?';
  room.turn.idx++;
  // 跳过已经出局的
  while (room.turn.idx < room.turn.order.length) {
    const p = room.players.find((x) => x.id === room.turn.order[room.turn.idx]);
    if (p && p.alive && p.online !== false) break;
    room.turn.idx++;
  }
  if (room.turn.idx < room.turn.order.length) {
    room.turn.deadline = Date.now() + TURN_SECONDS * 1000;
  }
  if (room.turn.idx >= room.turn.order.length) {
    room.turn = null;
    room.phase = 'vote';
    room.votes = {};
    const aliveN = room.players.filter((p) => p.alive).length;
    const secs = Math.max(25, Math.min(VOTE_SECONDS, 20 + aliveN * 3));
    room.voteDeadline = Date.now() + secs * 1000;
    sysMsg(room, `发言结束，开始投票，${secs} 秒后开票`);
    return;
  }
}

function checkWin(room){
  const alive = room.players.filter(p => p.alive);
  const uc = alive.filter(p => p.role === 'undercover').length;
  const civ = alive.length - uc;
  if (uc === 0) { room.winner = 'civilian'; room.phase = 'over'; sysMsg(room, '伪人全部出局，人类获胜'); return; }
  if (uc >= civ) { room.winner = 'undercover'; room.phase = 'over'; sysMsg(room, '伪人人数追平人类，伪人获胜'); return; }
}

function viewFor(room, meId){
  const me = room.players.find(p => p.id === meId);
  if (!me) return null;
  const reveal = room.phase === 'over';
  const seeAll = reveal || !me.alive;      // 出局 = 上帝视角（但只能在幽灵频道说话）
  return {
    code: room.code, phase: room.phase, round: room.round,
    meId: me.id, isHost: room.hostId === me.id,
    meAlive: me.alive,
    seeAll,
    hint: room.hint || '',
    turn: (room.phase === 'discuss' && room.turn) ? {
      id: room.turn.order[room.turn.idx],
      name: (room.players.find((p) => p.id === room.turn.order[room.turn.idx]) || {}).name || '?',
      mine: room.turn.order[room.turn.idx] === me.id,
      at: room.turn.idx + 1,
      total: room.turn.order.length,
    } : null,
    cards: room.phase === 'cards' ? room.cards.map((c) => ({
      slot: c.slot,
      poster: c.poster,
      name: CARD_NAMES[c.poster],
      takenBy: c.takenBy ? (room.players.find((p) => p.id === c.takenBy) || {}).name || '?' : null,
      mine: c.takenBy === me.id,
    })) : null,
    gameId: room.gameId || '',
    myCardPoster: (() => {
      const c = room.cards && room.cards.find((x) => x.takenBy === me.id);
      return c ? c.poster : null;
    })(),
    cardsLeftMs: (room.phase === 'cards' && room.cardsDeadline)
      ? Math.max(0, room.cardsDeadline - Date.now()) : null,
    voteLeftMs: (room.phase === 'vote' && room.voteDeadline)
      ? Math.max(0, room.voteDeadline - Date.now()) : null,
    nextLeftMs: (room.phase === 'result' && room.nextAt)
      ? Math.max(0, room.nextAt - Date.now()) : null,
    word: room.phase === 'lobby' ? null : me.word,
    role: (reveal || !me.alive) ? me.role : null,     // 进行中谁都不知道自己是哪边，出局/结束才揭晓
    players: room.players.map(p => ({
      id: p.id, name: p.name, avatar: (p.avatar ?? -1), alive: p.alive, isHost: p.id === room.hostId,
      online: p.online !== false,
      castVote: room.phase === 'vote' ? !!room.votes[p.id] : false,
      votesGot: (room.phase === 'result' || reveal) ? (room.lastTally?.[p.id] || 0) : null,
      role: seeAll ? p.role : (p.alive ? null : p.role),
      word: seeAll ? p.word : null,
    })),
    messages: room.messages
      .filter(m => !m.ghost || !me.alive || room.phase === 'over')
      .slice(-12),
    aliveCount: room.players.filter(p => p.alive).length,
    votedCount: room.players.filter((p) => p.alive && room.votes[p.id] !== undefined).length,
    needVotes: room.players.filter((p) => p.alive && p.online !== false).length,
    nextLeft: (room.phase === 'result' && room.nextAt) ? Math.max(0, Math.ceil((room.nextAt - Date.now())/1000)) : null,
    canVote: room.phase === 'vote' && me.alive && room.votes[me.id] === undefined,
    myVote: room.votes[me.id] || null,
    voteLeft: (room.phase === 'vote' && room.voteDeadline) ? Math.max(0, Math.ceil((room.voteDeadline - Date.now())/1000)) : null,
    lastOut: room.lastOut,
    winner: room.winner,
  };
}

/* 房主处理一条动作 */
function handleAction(room, fromId, act, push){
  const me = room.players.find(p => p.id === fromId);
  if (!me) return;
  me.lastSeen = Date.now();
  const err = (m) => push(fromId, { event:'toast', text:m });

  switch (act.type) {
    case 'start': {
      if (me.id !== room.hostId) return err('只有房主能开局');
      if (room.phase !== 'lobby' && room.phase !== 'over') return err('现在不能开局');
      const r = startGame(room);
      if (r.error) return err(r.error);
      break;
    }
    case 'chat': {
      const text = String(act.text || '').trim().slice(0, 200);
      if (!text) return;
      if (me.alive && room.phase === 'discuss' && room.turn) {
        const cur = room.turn.order[room.turn.idx];
        if (me.id !== cur) {
          const cn = (room.players.find((p) => p.id === cur) || {}).name || '别人';
          return err(`现在轮到 ${cn} 发言`);
        }
      }
      const now = Date.now();
      if (now - (me.lastChat || 0) < 700) return err('慢点儿，别刷屏');
      me.lastChat = now;
      pushMsg(room, {
        id: uid(), name: me.name, pid: me.id, text, at: Date.now(),
        ghost: !me.alive,
      });
      break;
    }
    case 'grab': {
      if (room.phase !== 'cards') return err('现在不是抢卡阶段');
      const slot = Number(act.slot);
      const card = room.cards && room.cards[slot];
      if (!card) return err('没有这张卡');
      if (card.takenBy) return err('慢了一步');
      if (room.cards.some((c) => c.takenBy === me.id)) return err('你已经抢过一张了');
      card.takenBy = me.id;
      me.avatar = card.poster;
      if (room.cards.every((c) => c.takenBy)) beginPlay(room);
      break;
    }

    case 'nextSpeaker': {
      if (room.phase !== 'discuss') return err('现在不是讨论阶段');
      if (!me.alive) return err('你已经出局了');
      if (!room.turn) return err('不在发言环节');
      const cur = room.turn.order[room.turn.idx];
      if (me.id !== cur) return err('还没轮到你');
      advanceTurn(room);
      break;
    }
    case 'vote': {
      if (room.phase !== 'vote') return err('现在不是投票阶段');
      if (!me.alive) return err('你已经出局了');
      if (room.votes[me.id] !== undefined) return err('这一票已经定了');

      if (act.target === 'abstain') {
        room.votes[me.id] = 'abstain';
      } else {
        const t = room.players.find(p => p.id === act.target);
        if (!t || !t.alive) return err('只能投活着的人');
        room.votes[me.id] = t.id;
      }

      // 全部自己确认了才开票
      const needVotes = room.players.filter(p => p.alive && p.online !== false).length;
      const castVotes = room.players.filter(p => p.alive && room.votes[p.id] !== undefined).length;
      if (castVotes >= needVotes) settleVote(room);
      break;
    }
    case 'nextRound': {
      if (room.phase !== 'result') return err('现在不是结算阶段');
      room.phase = 'discuss'; room.round++; room.votes = {};
      room.voteDeadline = null; room.nextAt = null; room.lastOut = null;
      // 首轮翻卡动画会占掉几秒，给第一位多留一点
  room.turn = { order: room.players.filter((p) => p.alive).map((p) => p.id), idx: 0,
    deadline: Date.now() + (TURN_SECONDS + 6) * 1000 };
        break;
    }
    case 'reset': {
      if (me.id !== room.hostId) return err('只有房主能重开');
      room.phase = 'lobby'; room.round = 0; room.votes = {};
      room.voteDeadline = null; room.nextAt = null; room.turn = null; room.lastTally = null; room.lastOut = null; room.winner = null;
      room.cards = null; room.cardsDeadline = null; room.hint = ''; room.idleRounds = 0;
      room.messages = [];
      room.players.forEach(p => { p.alive = true; p.role = null; p.word = null; p.avatar = -1; });
      sysMsg(room, '房间已重置，等人齐了再开一局');
      break;
    }
    case 'kick': {
      if (me.id !== room.hostId) return err('只有房主能踢人');
      const t = room.players.find(p => p.id === act.target);
      if (!t || t.id === me.id) return err('不能踢这个人');
      hostPush(room, t.id, { event:'kicked', text:'你被房主请出房间了' });
      sysMsg(room, `${t.name} 被房主请出房间`);
      removePlayer(room, t);
      break;
    }
    case 'leave': {
      if (me.id === room.hostId) {
        for (const p of room.players) {
          if (p.id !== me.id) hostPush(room, p.id, { event: 'closed', text: '房主离开了，房间结束' });
        }
        room.players = []; room.phase = 'over';
        room.turn = null; room.voteDeadline = null; room.nextAt = null;
        return;
      }
      sysMsg(room, `${me.name} 离开了房间`);
      removePlayer(room, me);
      break;
    }
    default:
      return;   // 未知类型不广播，避免被刷屏
  }
  push(null, null);   // 触发全房广播
}

/* ══════════════════════════════════════════════════════════════
   联机层：房主浏览器 = 服务端，其他人走公共 MQTT
   ══════════════════════════════════════════════════════════════ */
const TOPIC = (code) => 'wr/' + code;
const outOf = (code, clientId) => `${TOPIC(code)}/out/${clientId}`;

const net = {
  mqtt: null,
  myId: (() => {
    let v = sessionStorage.getItem('wr.id');
    if (!v) { v = uid(); sessionStorage.setItem('wr.id', v); }
    return v;
  })(),
  code: '',
  isHost: false,
  hostRoom: null,
  state: null,
  lastState: 0,
  joined: false,
};

function setNet(text){
  const bar = $('#netbar');
  if (!text) { bar.classList.remove('show'); return; }
  bar.textContent = text;
  bar.classList.add('show');
}

let connectingPromise = null;
function connectBroker(){
  if (net.mqtt && net.mqtt.connected) return Promise.resolve(net.mqtt);
  if (connectingPromise) return connectingPromise;
  connectingPromise = new Promise((resolve, reject) => {
    if (net.mqtt) { try { net.mqtt.close(); } catch {} net.mqtt = null; }
    const m = new MiniMQTT();
    m.onState = (st) => {
      const el = $('#netstatus');
      if (st === 'online') {
        el.textContent = '● 已连接，可以开房'; el.style.color = 'var(--ok-ink)';
        setNet('');
        // 断线重连成功：主动补一次状态，别让画面停在旧数据上
        if (net.code && (net.state || net.hostRoom)) {
          setTimeout(() => {
            if (!net.mqtt?.connected) return;
            if (net.isHost && net.hostRoom) hostBroadcast(net.hostRoom);
            else net.mqtt.publish(TOPIC(net.code) + '/in', { from: net.myId, type: 'resume' });
          }, 250);
        }
      }
      if (st === 'offline') { el.textContent = '● 连接断开，重连中…'; setNet('网络断开了，正在重连…'); }
      if (st === 'dead') { el.textContent = '● 连不上服务器'; setNet('连不上联机服务器，换个网络试试'); }
    };
    m.connect(net.myId)
      .then(() => { net.mqtt = m; connectingPromise = null; resolve(m); })
      .catch((e) => { net.mqtt = m; connectingPromise = null; reject(e); });
  });
  return connectingPromise;
}

/* 一次订阅好房间需要的所有主题 */
function attachRoom(code, isHost){
  if (!net.mqtt) return;
  if (isHost) net.mqtt.subscribe(`${TOPIC(code)}/in`, (t, data) => hostOnMessage(net.hostRoom, data));
  net.mqtt.subscribe(outOf(code, net.myId), (t, data) => onMyMessage(data));
  subHeartbeat();
}

/* 订阅房主心跳，用来判断房主还活着 */
function subHeartbeat(){
  if (!net.mqtt || !net.code) return;
  net.mqtt.subscribe(TOPIC(net.code) + '/hb', () => { net.lastHb = Date.now(); });
}

/* 房主把状态推给全房 */
let lastRoomSave = 0;
let lastSavedPhase = '';
function hostBroadcast(room){
  if (!room) return;
  // 每次都存：节流会让发言阶段漏存，刷新就退回上一次存盘的阶段
  room.touched = Date.now();
  try { sessionStorage.setItem('wr.room', JSON.stringify(room)); } catch (e) {}
  // 房主本地直接渲染，断线时自己也不卡
  try {
    const mine = viewFor(room, net.myId);
    if (mine) render(mine);
  } catch (e) {}
  if (!net.mqtt || !net.mqtt.connected) return;
  for (const p of room.players) {
    if (p.id === net.myId) continue;          // 房主本地已渲染，不用再发自己
    if (p.online === false) continue;          // 离线的先不发
    const v = viewFor(room, p.id);
    if (v) net.mqtt.publish(outOf(room.code, p.clientId), { event:'state', state: v });
  }
}

function hostPush(room, toId, payload){
  const p = room.players.find(x => x.id === toId);
  if (p && net.mqtt) net.mqtt.publish(outOf(room.code, p.clientId), payload);
}

/* 直接按 clientId 发（给还没进房间的人用，比如被拒绝加入的）*/
function hostPushRaw(room, clientId, payload){
  if (net.mqtt) net.mqtt.publish(outOf(room.code, clientId), payload);
}

/* 房主收到房间里所有客户端发来的动作 */
function hostOnMessage(room, raw){
  let msg;
  try { msg = JSON.parse(raw); } catch { return; }
  if (!msg || typeof msg !== 'object') return;
  const from = msg.from;
  if (typeof from !== 'string' || !from) return;

  if (msg.type === 'ping') {
    const q = room.players.find(x => x.id === from);
    if (q) { q.lastSeen = Date.now(); if (q.online === false) { q.online = true; hostBroadcast(room); } }
    return;
  }

  if (msg.type === 'join') {
    let p = room.players.find(x => x.id === from);
    if (p) {                       // 断线重连
      p.clientId = from; p.lastSeen = Date.now(); p.online = true;
      hostBroadcast(room);
      return;
    }
    if (room.phase !== 'lobby' && room.phase !== 'over') {
      hostPushRaw(room, from, { event:'rejected', text:'这局已经开始了，等下一局吧' });
      return;
    }
    if (room.players.length >= 6) {
      hostPushRaw(room, from, { event:'rejected', text:'房间满了（最多 6 人）' });
      return;
    }
    let name = String(msg.name || '玩家').trim().slice(0, 12) || '玩家';
    const base = name; let i = 2;
    while (room.players.some(x => x.name === name)) name = base + (i++);
    room.players.push({ id: from, clientId: from, name, avatar: -1, alive:true, role:null, word:null, lastSeen:Date.now(), online:true });
    sysMsg(room, `${name} 加入了房间`);
    hostBroadcast(room);
    return;
  }

  if (msg.type === 'resume') { hostBroadcast(room); return; }

  handleAction(room, from, msg, (toId, payload) => {
    if (toId && payload) hostPush(room, toId, payload);
    else hostBroadcast(room);
  });
}

/* ── 开房 ── */
async function hostCreate(name){
  const code = String(Math.floor(1000 + Math.random() * 9000));
  net.code = code;
  net.isHost = true;

  const room = newRoom(code, net.myId, name);
  net.hostRoom = room;

  net.mqtt.subscribe(TOPIC(code) + '/in', (t, data) => hostOnMessage(room, data));
  net.mqtt.subscribe(TOPIC(code) + '/out/' + net.myId, (t, data) => onMyMessage(data));
  subHeartbeat();
  net.lastHb = Date.now();

  hostBroadcast(room);

  store.code = code;
  enterRoom();
}

/* ── 进房 ── */
async function joinRoom(name, code){
  net.code = code;
  net.isHost = false;
  store.code = code;

  net.mqtt.subscribe(TOPIC(code) + '/out/' + net.myId, (t, data) => onMyMessage(data));
  subHeartbeat();
  enterRoom();
  net.mqtt.publish(TOPIC(code) + '/in', { from: net.myId, type:'join', name });

  // 5 秒没回音 → 房间不存在或房主没开
  net.rejected = false;
  setTimeout(() => {
    if (!net.state && !net.rejected) {
      setNet('房间 ' + code + ' 没响应，房主可能没开或房间号错了');
      leaveToHome();
    }
  }, 6000);
}

/* 收到房主发来的消息 */
function onMyMessage(data){
  let msg;
  try { msg = JSON.parse(data); } catch { return; }
  if (msg.event === 'state' && msg.state) {
    net.lastState = Date.now();
    render(msg.state);
    setNet('');
  } else if (msg.event === 'toast') {
    toast(msg.text);
  } else if (msg.event === 'rejected') {
    toast(msg.text, 2400);
    net.rejected = true;
    leaveToHome();
  } else if (msg.event === 'closed') {
    toast(msg.text || '房间已结束', 3000);
    leaveToHome();
  } else if (msg.event === 'kicked') {
    toast(msg.text, 2200);
    leaveToHome();
  }
}

/* 玩家发动作 */
function sendAct(type, extra){
  if (!net.mqtt) { setNet('还没有连上服务器…'); return false; }
  if (!net.isHost && !net.mqtt.connected) { setNet('网络断了，正在重连…这次操作没发出去'); return false; }
  const msg = Object.assign({ from: net.myId, type }, extra || {});
  if (net.isHost && net.hostRoom) {
    hostOnMessage(net.hostRoom, JSON.stringify(msg));   // 房主自己直接走本地逻辑
  } else {
    net.mqtt.publish(TOPIC(net.code) + '/in', msg);
  }
}

/* ══════════════════════════════════════════════════════════════
   界面
   ══════════════════════════════════════════════════════════════ */
const CHIPS = ['你们先说', '挺普通的', '不好形容', '投吧'];
const GHOST_CHIPS = ['我早说了', '果然', '看戏', '投他'];
let lastChipMode = '';
let lastModalKey = '';
let lastFeedKey = '';
let lastPlKey = '';
let lastCardKey = '';
let lastPhase = '';
let pickedId = null;
let localCardsDeadline = 0;   // 抢卡倒计时的本地基准
let shownOutId = '';        // 这次出局结果已经弹过没有
let shownOver = false;      // 整局结果已经弹过没有
let localVoteDeadline = 0, localNextDeadline = 0;

function enterRoom(){
  $('#home').classList.add('hide');
  $('#room').classList.remove('hide');
  $('#rc b').textContent = net.code;
  lastChipMode = '';
}

function leaveToHome(){
  net.hostGone = false; net.hostWarned = false;
  try { closeStages(); } catch (e) {}
  if (net.mqtt) net.mqtt.topicHandlers.clear();
  net.state = null; net.hostRoom = null; net.isHost = false; net.hostWarned = false; net.code = '';
  store.code = '';
  $('#room').classList.add('hide');
  $('#home').classList.remove('hide');
  $('#modal').classList.add('hide');
}

function overHtml(s){
  const w = s.winner === 'civilian' ? '人类赢了' : '伪人赢了';
  const list = s.players.map(p => {
    const role = p.role == null ? '—' : (p.role === 'undercover' ? '伪人' : '人类');
    const color = p.role === 'undercover' ? 'var(--bad-ink)' : (p.role == null ? 'var(--dim-ink)' : 'var(--ok-ink)');
    return `<div class="ovrow">
      <span class="ovname">${esc(p.name)}</span>
      <span class="ovrole" style="color:${color}">${role}</span>
      <span class="ovword">${esc(p.word || '')}</span>
    </div>`;
  }).join('');
  return `<h2>${w}</h2>
    <div class="ovlist">${list}</div>
    <div class="ovtip">点空白处关闭</div>`;
}

function showModal(html){
  const key = html.slice(0, 60);
  if (key === lastModalKey && !$('#modal').classList.contains('hide')) return;
  lastModalKey = key;
  $('#modal-body').innerHTML = html;
  $('#modal').classList.remove('hide');
  $('#modal').onclick = (e) => {
    if (e.target.id === 'modal' || e.target.id === 'modal-x') $('#modal').classList.add('hide');
  };
}

/* 被票出：头像弹出 → 红光 → 碎裂四散 → 身份浮现 */
function playEject(out){
  const stage = $('#ejectstage'), box = $('#ejectbox'), label = $('#ejectlabel');
  if (!stage || !box || !label) return;
  ejectTimers.forEach(clearTimeout);
  ejectTimers = [];

  const src = AVATARS[Math.max(0, out.avatar ?? 0) % 6];
  const pieces = [
    ['0 0,58% 0,36% 44%,0 61%',        '-152px', '-128px', '-33deg'],
    ['58% 0,100% 0,100% 41%,36% 44%',   '158px', '-124px', '27deg'],
    ['0 61%,36% 44%,64% 57%,46% 100%,0 100%', '-146px', '134px', '21deg'],
    ['36% 44%,100% 41%,100% 100%,46% 100%,64% 57%', '154px', '130px', '-25deg'],
  ];
  box.innerHTML = pieces.map(([clip, tx, ty, rot]) =>
    `<div class="shard" style="clip-path:polygon(${clip});--tx:${tx};--ty:${ty};--rot:${rot}"><img src="${src}" alt=""></div>`
  ).join('');

  const isUC = out.role === 'undercover';
  label.textContent = `${out.name} · ${isUC ? '伪人' : '人类'}`;
  label.style.color = isUC ? 'var(--bad-ink)' : '#5A3C2C';
  label.style.textShadow = 'none';

  stage.onclick = () => { ejectTimers.forEach(clearTimeout); ejectTimers = []; stage.className = 'hide'; };
  stage.className = '';
  void stage.offsetWidth;
  requestAnimationFrame(() => stage.classList.add('show'));
  ejectTimers.push(setTimeout(() => stage.classList.add('flash'), 300));
  ejectTimers.push(setTimeout(() => stage.classList.add('shatter'), 620));
  ejectTimers.push(setTimeout(() => stage.classList.add('label'), 1080));
  ejectTimers.push(setTimeout(() => stage.className = 'hide', 3000));
}

/* 抢卡结束 → 卡面弹入 → 翻面 → 露词 */
let flipTimers = [];
let ejectTimers = [];
let overTimer = null;

/* 关掉所有浮层并清定时器 */
function closeStages(){
  flipTimers.forEach(clearTimeout); flipTimers = [];
  ejectTimers.forEach(clearTimeout); ejectTimers = [];
  if (overTimer) { clearTimeout(overTimer); overTimer = null; }
  for (const id of ['flipstage','ejectstage']) {
    const el = document.getElementById(id);
    if (el) el.className = 'hide';
  }
}
function playFlip(s){
  if (s.myCardPoster == null || !s.word) return;
  const stage = document.getElementById('flipstage');
  stage.onclick = () => { flipTimers.forEach(clearTimeout); flipTimers = []; stage.className = 'hide'; };
  const wrap = document.getElementById('flipwrap');
  const card = document.getElementById('flipcard');
  if (!stage || !wrap || !card) return console.warn('[flip] DOM missing');

  flipTimers.forEach(clearTimeout);
  flipTimers = [];

  $('#flipimg').src = CARD_BACKS[s.myCardPoster];
  $('#flipword').textContent = s.word;
  $('#fliprole').textContent = '记住这个词';

  wrap.classList.remove('enter', 'out');
  card.classList.remove('flipped');
  stage.classList.remove('show', 'hide');
  void stage.offsetWidth;              // 强制重排，让过渡重新触发

  requestAnimationFrame(() => {
    stage.classList.add('show');
    requestAnimationFrame(() => wrap.classList.add('enter'));
  });

  flipTimers.push(setTimeout(() => card.classList.add('flipped'), 480));
  flipTimers.push(setTimeout(() => wrap.classList.add('out'), 3600));
  flipTimers.push(setTimeout(() => stage.classList.remove('show'), 3900));
  flipTimers.push(setTimeout(() => {
    stage.classList.add('hide');
    wrap.classList.remove('out');
  }, 4300));
}

function render(s){
  if (!s) return;
  const first = !net.state;
  net.state = s;

  const prevPhase = lastPhase;
  lastPhase = s.phase;

  // 翻卡：每局每人只播一次，不依赖阶段对比
  if (s.phase === 'discuss' && s.word && s.myCardPoster != null) {
    const flipKey = 'flip_' + s.code + '_' + s.meId + '_' + s.gameId;
    if (!sessionStorage.getItem(flipKey)) {
      sessionStorage.setItem(flipKey, '1');
      const snap = JSON.parse(JSON.stringify({ word: s.word, myCardPoster: s.myCardPoster }));
      overTimer = setTimeout(() => { overTimer = null; playFlip(snap); }, 420);
    }
  }

  if (s.phase === 'lobby' || s.phase === 'discuss' || s.phase === 'vote') {
    $('#modal').classList.add('hide');
    lastModalKey = '';
  }
  if (s.phase === 'lobby') {
    shownOutId = ''; shownOver = false; pickedId = null;
    if (overTimer) { clearTimeout(overTimer); overTimer = null; }
    const mdl = document.getElementById('modal');
    if (mdl) mdl.classList.add('hide');
  }
  if (s.phase !== 'vote') pickedId = null;

  // 阶段
  const names = { lobby:'大厅', cards:'抢卡', discuss:'讨论', vote:'投票中', result:'结算', over:'已结束' };
  let pt = names[s.phase] + ' · ' + s.players.length + '人';
  if (s.phase === 'cards') {
    if (s.cardsLeftMs != null && (prevPhase !== 'cards' || !localCardsDeadline)) {
      localCardsDeadline = Date.now() + s.cardsLeftMs;
    }
  } else localCardsDeadline = 0;

  if (s.phase === 'vote') {
    if (s.voteLeftMs != null && (prevPhase !== 'vote' || !localVoteDeadline)) {
      localVoteDeadline = Date.now() + s.voteLeftMs;
    }
  } else localVoteDeadline = 0;

  if (s.phase === 'result') {
    if (s.nextLeftMs != null && (prevPhase !== 'result' || !localNextDeadline)) {
      localNextDeadline = Date.now() + s.nextLeftMs;
    }
  } else if (s.phase !== 'result') localNextDeadline = 0;

  if (s.phase === 'discuss') pt = s.turn ? `发言 ${s.turn.at}/${s.turn.total} · ${s.turn.name}` : `讨论第${s.round}轮`;
  if (s.phase === 'vote') {
    const left = localVoteDeadline ? Math.max(0, Math.ceil((localVoteDeadline - Date.now()) / 1000)) : null;
    pt = left != null ? `投票 ${left}s · ${s.votedCount}/${s.needVotes ?? s.aliveCount}` : `投票 · ${s.votedCount}/${s.needVotes ?? s.aliveCount}`;
  }
  if (s.phase === 'result' && localNextDeadline) {
    const left = Math.max(0, Math.ceil((localNextDeadline - Date.now()) / 1000));
    pt = `结算 · ${left}s 后继续`;
  }
  if ($('#phase').textContent !== pt) $('#phase').textContent = pt;
  $('#phase').classList.toggle('hot', s.phase === 'vote' || s.phase === 'discuss');

  // 抢卡桌
  if (s.phase === 'cards' && s.cards) {
    $('#cardtable').classList.remove('hide');
    $('#cttimer').textContent = localCardsDeadline ? Math.max(0, Math.ceil((localCardsDeadline - Date.now()) / 1000)) + 's' : '--';
    const box = $('#ctcards');
    const cols = s.cards.length <= 4 ? 2 : 3;             // 3-4 人两列，5-6 人三列
    box.style.maxWidth = (cols * 100 + (cols - 1) * 9) + 'px';
    const ckey = s.cards.map(c => `${c.slot}:${c.poster}:${c.takenBy || ''}`).join('|');
    if (ckey !== lastCardKey) {
      lastCardKey = ckey;
      box.innerHTML = s.cards.map(c => `
        <div class="pcard ${c.takenBy ? 'taken' : ''} ${c.mine ? 'mine' : ''}" data-slot="${c.slot}">
          <img src="${CARD_BACKS[c.poster]}" alt="">
          ${c.takenBy ? `<div class="who">${esc(c.takenBy)}</div>` : ''}
        </div>`).join('');
      box.querySelectorAll('.pcard').forEach((el) => {
        el.onclick = () => {
          if (el.classList.contains('taken')) return;
          sendAct('grab', { slot: Number(el.dataset.slot) });
        };
      });
    }
    const mineAlready = s.cards.some(c => c.mine);
    $('#cttip').textContent = mineAlready ? '你已抢到，等人齐' : '点一张，先到先得';
  } else {
    $('#cardtable').classList.add('hide');
  }

  // 词长提示条
  const hb = $('#hintbar');
  if (s.hint && s.phase !== 'cards' && s.phase !== 'over') {
    hb.textContent = '⚠ ' + s.hint;
    hb.classList.remove('hide');
  } else hb.classList.add('hide');

  // 头像（状态没变就跳过重建，16 人局每次广播都重建会卡）
  const pl = $('#players');
  const plKey = s.players.map(p =>
    `${p.id}_${p.avatar}_${p.alive?1:0}${p.online===false?0:1}${p.castVote?1:0}${p.votesGot??''}${p.isHost?1:0}`
  ).join('|') + '#' + (s.canVote ? 1 : 0) + '#' + s.meId + '#' + (pickedId || '');
  if (plKey !== lastPlKey) {
  lastPlKey = plKey;
  const keepLeft = pl.scrollLeft;
  pl.innerHTML = s.players.map(p => {
    const votable = s.canVote && p.alive;
    const picked = pickedId === p.id;
    return `<div class="pl ${p.alive?'':'dead'} ${votable?'votable':''} ${picked?'picked':''} ${p.id===s.meId?'me':''} ${p.isHost?'host':''} ${p.online===false?'offline':''}" data-id="${p.id}">
      <div class="av ${(p.avatar ?? -1) < 0 ? 'unknown' : ''} ${s.seeAll && p.role==='undercover'?'ucglow':(s.seeAll&&p.role==='civilian'?'civglow':'')}" style="--c:${(p.avatar ?? -1) >= 0 ? colorOf(p.avatar) : '#F0DCD0'}">
        ${(p.avatar ?? -1) < 0 ? '?' : `<img src="${AVATARS[p.avatar % 6]}" alt="" loading="lazy">`}
        ${p.isHost?'<span class="hostmark" aria-label="房主"></span>':''}
        ${p.castVote?'<span class="rdy"></span>':''}
        ${p.online===false ? '<span class="offdot"></span>' : ''}
        ${(p.votesGot > 0) ? `<span class="badge2">${p.votesGot}</span>` : ''}
      </div>
      <div class="nm" title="${esc(p.name)}">${esc(p.name)}${p.isHost?'<span class="hosttag">房主</span>':''}</div>
      ${s.seeAll && p.role ? `<div class="rl ${p.role==='undercover'?'uc':'civ'}">${p.role==='undercover'?'伪人':'人类'}</div>` : ''}
    </div>`;
  }).join('');
  pl.querySelectorAll('.pl').forEach((el) => {
    el.onclick = () => {
      if (!el.classList.contains('votable')) return;
      pickedId = (pickedId === el.dataset.id) ? null : el.dataset.id;
      render(net.state);          // 就地刷新红框
    };
  });
  pl.scrollLeft = keepLeft;
  }

  // 消息
  const avatarMap = new Map(s.players.map(p => [p.id, p.avatar ?? 0]));
  const avOf = (pid) => avatarMap.has(pid) ? avatarMap.get(pid)
    : [...String(pid)].reduce((a,c)=>a+c.charCodeAt(0),0) % 6;
  const feed = $('#feed');
  const atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 90;
  const feedKey = s.messages.length + ':' + (s.messages.length ? s.messages[s.messages.length - 1].id : '');
  if (first || feedKey !== lastFeedKey) {
    lastFeedKey = feedKey;
    const keepScroll = feed.scrollTop;
    feed.innerHTML = s.messages.map(m => m.sys
      ? `<div class="sys">${esc(m.text)}</div>`
      : `<div class="msg ${m.pid===s.meId?'mine':''} ${m.ghost?'ghost':''}">
           <div class="who">${esc(m.name)}</div>
           <div class="bub">${esc(m.text)}</div>
         </div>`).join('');
    if (first || atBottom) feed.scrollTop = feed.scrollHeight;
    else feed.scrollTop = keepScroll;
  }

  // 词条
  const wb = $('#wordbar');
  if (s.word && ['discuss','vote','result'].includes(s.phase)) {
    wb.classList.remove('hide');
    $('#holdbtn').textContent = s.meAlive ? '按住查看你的词' : '已出局 · 身份全公开';
  } else wb.classList.add('hide');

  // 快捷语：出局的人换成幽灵频道那一套
  const chipMode = s.meAlive ? 'alive' : 'ghost';
  if (chipMode !== lastChipMode) {
    lastChipMode = chipMode;
    const list = chipMode === 'alive' ? CHIPS : GHOST_CHIPS;
    const box = $('#chips');
    box.innerHTML = list.map(c => `<button class="chip">${esc(c)}</button>`).join('');
    box.querySelectorAll('.chip').forEach((b, i) => {
      b.onclick = () => sendAct('chat', { text: list[i] });
    });
  }
  $('#chips').classList.toggle('hide', s.phase === 'lobby' || s.phase === 'over');

  // 出局后输入框变成幽灵频道
  const inp = $('#in-msg'), sendBtn = $('#btn-send');
  const isGhost = !s.meAlive && s.phase !== 'over';
  const waiting = s.meAlive && s.phase === 'discuss' && s.turn && !s.turn.mine;
  const voted = s.meAlive && s.phase === 'vote' && !s.canVote;
  const canChat = s.phase !== 'over' && !waiting;
  inp.disabled = !canChat;
  if (sendBtn) sendBtn.disabled = !canChat;
  inp.placeholder = isGhost ? '幽灵频道 · 只有出局的人看得到'
    : waiting ? `${s.turn.name} 正在发言…`
    : voted ? '投完了，还能聊' : '说点什么…';
  const chipsEl = $('#chips');
  if (chipsEl) chipsEl.classList.toggle('hide', s.phase === 'lobby' || s.phase === 'over' || inp.disabled);

  // 操作区
  const act = $('#actrow');
  act.innerHTML = '';
  const addBtn = (label, cls, fn, disabled = false) => {
    const b = document.createElement('button');
    b.className = 'btn ' + cls; b.innerHTML = '<span>' + esc(label) + '</span>';
    if (disabled) b.disabled = true; else b.onclick = fn;
    act.appendChild(b);
  };

  if (s.phase === 'cards') {
    addBtn('抢卡中…', 'ghost', null, true);
  }
  else if (s.phase === 'lobby') {
    const n = s.players.length;
    if (s.isHost) addBtn(n >= 3 ? `开始游戏 · ${n} 人` : `还差 ${3 - n} 人`, 'primary', () => sendAct('start'), n < 3);
    else addBtn(n >= 3 ? '等房主开始…' : `还差 ${3 - n} 人`, 'ghost', null, true);
  }
  else if (s.phase === 'discuss') {
    if (s.turn) {
      if (s.turn.mine) addBtn('说完了', 'primary', () => sendAct('nextSpeaker'));
      else addBtn(`轮到 ${s.turn.name}`, 'ghost', () => toast('还没轮到你'), true);
    }
  }
  else if (s.phase === 'vote') {
    if (s.canVote) {
      const target = pickedId ? (s.players.find((p) => p.id === pickedId) || {}).name : '';
      if (target) addBtn(`确认投 ${target}`, 'primary', () => { sendAct('vote', { target: pickedId }); pickedId = null; });
      else addBtn(`点头像选人 ${s.votedCount}/${s.needVotes ?? s.aliveCount}`, 'ghost', () => toast('先点一个头像'), true);

      const skip = document.createElement('button');
      skip.className = 'btn ghost';
      skip.style.flex = '0 0 72px';
      skip.textContent = '弃票';
      skip.onclick = () => { sendAct('vote', { target: 'abstain' }); pickedId = null; };
      act.appendChild(skip);
    } else if (!s.meAlive) {
      addBtn(`已出局 · 旁观 ${s.votedCount}/${s.needVotes ?? s.aliveCount}`, 'ghost', null, true);
    } else {
      addBtn(`已投票 · ${s.votedCount}/${s.needVotes ?? s.aliveCount}`, 'ghost', null, true);
    }

  }
  else if (s.phase === 'result') {
    if (s.lastOut && s.lastOut.id !== shownOutId) {
      shownOutId = s.lastOut.id;
      playEject(s.lastOut);
    }
    addBtn('立即继续', 'primary', () => sendAct('nextRound'));
  }
  else if (s.phase === 'over') {
    if (s.lastOut && s.lastOut.id !== shownOutId) {
      shownOutId = s.lastOut.id;
      playEject(s.lastOut);
    }
    if (!shownOver) { shownOver = true; overTimer = setTimeout(() => showModal(overHtml(s)), 3600); }
    addBtn('看结果', 'ghost', () => { lastModalKey = ''; showModal(overHtml(s)); });
    if (s.isHost) addBtn('再来一局', 'primary', () => sendAct('reset'));
    else addBtn('等房主开新局…', 'ghost', null, true);
  }
}

/* ══════════════════════════════════════════════════════════════
   交互
   ══════════════════════════════════════════════════════════════ */
$('#in-name').value = store.name;

function copy(text, tip){
  navigator.clipboard?.writeText(text).then(() => toast(tip)).catch(() => {
    const i = document.createElement('input');
    i.value = text; document.body.appendChild(i); i.select();
    document.execCommand('copy'); i.remove(); toast(tip);
  });
}

$('#btn-create').onclick = async () => {
  const name = $('#in-name').value.trim();
  if (!name) return ($('#home-err').textContent = '先起个名字呗');
  store.name = name;
  if (!net.mqtt || !net.mqtt.connected) {
    $('#home-err').textContent = '正在重连服务器…';
    try { await connectBroker(); restoreRoom(); } catch { return ($('#home-err').textContent = '连不上联机服务器，换个网络再试'); }
    if (document.querySelector('#room').classList.contains('hide') === false) return;
  }
  $('#home-err').textContent = '';
  $('#btn-create').textContent = '正在开房…';
  try { await hostCreate(name); }
  finally { $('#btn-create').textContent = '开个房间'; }
};

$('#btn-join').onclick = async () => {
  const name = $('#in-name').value.trim();
  const code = $('#in-code').value.replace(/\D/g, '');
  if (!name) return ($('#home-err').textContent = '先起个名字呗');
  if (code.length !== 4) return ($('#home-err').textContent = '房间号是 4 位数字');
  store.name = name;
  if (!net.mqtt || !net.mqtt.connected) {
    $('#home-err').textContent = '正在重连服务器…';
    try { await connectBroker(); } catch { return ($('#home-err').textContent = '连不上联机服务器，换个网络再试'); }
  }
  $('#home-err').textContent = '';
  await joinRoom(name, code);
};

$('#rc').onclick = () => { if (net.code) copy(net.code, '房间号已复制'); };
$('#btn-leave').onclick = () => {
    if (!net.code) return;
    if (net.isHost) {
      if (!confirm('你是房主，离开会结束这一局，确定吗？')) return;
    } else if (!confirm('确定离开房间？')) return;
    sendAct('leave');
    leaveToHome();
  };
  $('#btn-share').onclick = () => {
  if (!net.code) return;
  const host = location.hostname;
  const isLocal = location.protocol === 'file:'
    || /^(localhost|127\.|0\.0\.0\.0|\[::1\])/.test(host)
    || /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(host);
  const link = location.origin + location.pathname + '?room=' + net.code;
  if (location.protocol === 'file:') {
    toast('这是本地文件，把 html 发群里大家下载打开就行', 2800);
    return;
  }
  if (isLocal) {
    copy(link, '已复制，但这是本机地址，别人打不开');
    setTimeout(() => toast('要让别人能进，得把这个 html 放到公网（任意静态托管）', 3200), 1200);
    return;
  }
  copy(link, '链接已复制，发群里吧');
};

$('#btn-send').onclick = sendMsg;
$('#in-msg').addEventListener('keydown', e => { if (e.key === 'Enter') sendMsg(); });
function sendMsg(){
  const v = $('#in-msg').value.trim();
  if (!v) return;
  $('#in-msg').value = '';
  sendAct('chat', { text: v });
}

/* 按住看词 */
const hideVeil = () => $('#veil').classList.add('hide');
$('#holdbtn').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const s = net.state;
  if (!s?.word) return;
  $('#veil-word').textContent = s.word;
  $('#veil-role').textContent = s.role === 'undercover' ? '你是伪人' : (s.role === 'civilian' ? '你是人类' : '');
  $('#veil').classList.remove('hide');
});
['pointerup','pointercancel','pointerleave','touchend','touchcancel'].forEach(ev =>
  $('#holdbtn').addEventListener(ev, hideVeil));
document.addEventListener('pointerup', hideVeil);
document.addEventListener('touchend', hideVeil);
$('#holdbtn').addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('blur', hideVeil);

/* ══ 统一时钟：倒计时 / 自动结算 / 自动推进 / 心跳 / 在线检测 ══ */
let clockTick = 0;

function autoNext(room){
  openDiscussion(room, true);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  // 后台期间定时器被节流，回来先把时钟基准清零，否则 gap 会把活房主判成死了
  net.lastState = Date.now(); net.lastHb = Date.now();
  net.hostGone = false; net.hostWarned = false;
  if (net.isHost && net.hostRoom) {
    const now = Date.now();
    net.hostRoom.players.forEach((p) => { p.lastSeen = now; });
  }
  if (!net.code || !net.mqtt?.connected) return;
  net.mqtt.publish(TOPIC(net.code) + '/in', { from: net.myId, type: 'ping' });
});

setInterval(() => {
  clockTick++;
  const now = Date.now();

  /* — 房主端 — */
  const r = net.hostRoom;
  if (r) {
    if (r.phase === 'cards' && r.cardsDeadline && now >= r.cardsDeadline) {
      beginPlay(r); hostBroadcast(r);
    } else if (r.phase === 'vote' && r.voteDeadline && now >= r.voteDeadline) {
      settleVote(r); hostBroadcast(r);
    } else if (r.phase === 'result' && r.nextAt && now >= r.nextAt) {
      autoNext(r); hostBroadcast(r);
    } else if (r.phase === 'discuss' && r.turn && r.turn.deadline && now >= r.turn.deadline) {
      advanceTurn(r); hostBroadcast(r);
    }
    if (net.mqtt?.connected && now - (net.lastHbSent || 0) >= 5000) {
      net.lastHbSent = now;
      net.mqtt.publish(TOPIC(net.code) + '/hb', { t: now });
    }
    // 谁掉线了，标一下（大厅里太久没动静的直接请出去）
    if (clockTick % 10 === 0) {
      let changed = false;
      for (const p of r.players) {
        if (p.id === r.hostId) continue;
        const idle = now - (p.lastSeen || 0);
        if (idle > 90000 && p.online !== false) { p.online = false; changed = true; }
        if (idle < 90000 && p.online === false) { p.online = true; changed = true; }
      }
      if (r.phase === 'lobby') {
        const gone = r.players.filter(p => p.id !== r.hostId && now - (p.lastSeen || 0) > 180000);
        if (gone.length) {
          r.players = r.players.filter(p => !gone.includes(p));
          gone.forEach(p => sysMsg(r, `${p.name} 掉线太久，已移出房间`));
          changed = true;
        }
      }
      if (changed) hostBroadcast(r);
    }
  }

  /* — 玩家端 — */
  const s = net.state;
  if (s) {
    if (s.phase === 'cards' && localCardsDeadline) {
      const el = document.getElementById('cttimer');
      if (el) {
        const txt = Math.max(0, Math.ceil((localCardsDeadline - now) / 1000)) + 's';
        if (el.textContent !== txt) el.textContent = txt;
      }
    }
    if (s.phase === 'vote' && localVoteDeadline) {
      const left = Math.max(0, Math.ceil((localVoteDeadline - now) / 1000));
      const el = $('#phase');
      const txt = `投票 ${left}s · ${s.votedCount}/${s.needVotes ?? s.aliveCount}`;
      if (el && el.textContent !== txt) el.textContent = txt;
    }
    if (s.phase === 'result' && localNextDeadline) {
      const left = Math.max(0, Math.ceil((localNextDeadline - now) / 1000));
      const el = $('#phase');
      const txt = `结算 · ${left}s 后继续`;
      if (el && el.textContent !== txt) el.textContent = txt;
    }
    if (!net.isHost) {
      if (clockTick % 20 === 0 && net.mqtt?.connected) {
        net.mqtt.publish(TOPIC(net.code) + '/in', { from: net.myId, type: 'ping' });
      }
      if (clockTick % 5 === 0) {
        const gap = now - Math.max(net.lastHb || 0, net.lastState || 0);
        // 手机后台会把定时器节流到 1 分钟一次，阈值放宽避免误报
        if (gap > 180000 && !net.hostGone) {
          net.hostGone = true; toast('房主已离线，房间结束', 3000); leaveToHome();
        } else if (gap > 75000 && !net.hostWarned) { net.hostWarned = true; setNet('房主好像掉线了…在等他回来'); }
        else if (gap < 30000 && net.hostWarned) { net.hostWarned = false; setNet(''); }
      }
    }
  }
}, 1000);

/* 首页 ?room=1234 自动填；?fresh=1 强制开新局不回旧房 */
/* 内置浏览器提示：QQ/微信 WebView 常拦 wss，引导用系统浏览器 */
(function(){
  const ua = navigator.userAgent || '';
  const inApp = /\bQQ\//i.test(ua) || /MicroMessenger/i.test(ua) || /Weibo/i.test(ua);
  if (!inApp) return;
  const bar = document.createElement('div');
  bar.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:999;padding:9px 14px;'
    + 'background:#FF6F9C;color:#fff;font:12px/1.45 -apple-system,"PingFang SC",sans-serif;text-align:center';
  bar.textContent = '在 QQ 里可能连不上服务器 · 点右上角「⋯」选「在浏览器打开」';
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(bar));
})();

const qs = new URLSearchParams(location.search);
if (qs.get('room')) $('#in-code').value = qs.get('room');
if (qs.get('fresh')) {
  store.code = '';
  sessionStorage.removeItem('wr.room');
}

/* 启动：房主刷新后原地恢复 */
function restoreRoom(){
  let room;
  try { room = JSON.parse(sessionStorage.getItem('wr.room') || 'null'); } catch { room = null; }
  if (!room || room.hostId !== net.myId) return false;
  if (Date.now() - (room.touched || 0) > 30 * 60000) {
    sessionStorage.removeItem('wr.room');
    return false;
  }
  net.code = room.code;
  net.isHost = true;
  net.hostRoom = room;
  net.mqtt.subscribe(TOPIC(room.code) + '/in', (t, data) => hostOnMessage(room, data));
  net.mqtt.subscribe(TOPIC(room.code) + '/out/' + net.myId, (t, data) => onMyMessage(data));
  subHeartbeat();
  hostBroadcast(room);
  enterRoom();
  toast('房间 ' + room.code + ' 已恢复');
  return true;
}

/* 玩家刷新后静默重连回原房间 */
function autoRejoin(){
  const code = store.code, name = store.name;
  if (!code || !name || net.state || !net.mqtt) return false;
  net.code = code;
  net.isHost = false;
  net.mqtt.subscribe(TOPIC(code) + '/out/' + net.myId, (t, data) => onMyMessage(data));
  subHeartbeat();
  enterRoom();
  net.rejected = false;
  net.mqtt.publish(TOPIC(code) + '/in', { from: net.myId, type: 'join', name });
  setTimeout(() => {
    if (!net.state && !net.rejected) {
      leaveToHome();
      toast('上次的房间已经不在了', 2200);
    }
  }, 5000);
  return true;
}

/* 启动：连 broker */
connectBroker().then(() => {
  if (restoreRoom()) return;
  autoRejoin();
}).catch(() => {
  $('#netstatus').textContent = '● 连不上，点任意按钮重试';
  setNet('连不上联机服务器，检查一下网络');
});
